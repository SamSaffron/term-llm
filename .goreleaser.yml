version: 2

# Build configuration
builds:
  - id: term-llm
    binary: term-llm
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows support is validated on amd64 only.
      - goos: windows
        goarch: arm64
    main: ./main.go
    ldflags:
      - -s -w
      - -X github.com/samsaffron/term-llm/cmd.Version={{.Version}}
      - -X github.com/samsaffron/term-llm/cmd.Commit={{.Commit}}
      - -X github.com/samsaffron/term-llm/cmd.Date={{.Date}}

# Archive configuration
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - internal/terminal/runtime/LICENSE
      - internal/terminal/renderer/LICENSE
      - internal/reflow/LICENSE

# Release configuration
release:
  github:
    owner: samsaffron
    name: term-llm
  name_template: "Release {{ .Tag }}"
  draft: false
  prerelease: false

# Checksum configuration
checksum:
  name_template: 'checksums.txt'

# Changelog configuration
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
