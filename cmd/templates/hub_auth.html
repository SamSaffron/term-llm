<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{.Title}} - term-llm Hub</title>
  <style nonce="{{.Nonce}}">:root{color-scheme:dark light}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#0d1117;color:#e6edf3}main{width:min(26rem,calc(100vw - 2rem));padding:1.5rem;border:1px solid #30363d;border-radius:16px;background:#161b22}h1{margin:0 0 .5rem}p{color:#8b949e}label{display:block;margin:.8rem 0}input,button{box-sizing:border-box;width:100%;padding:.75rem;border-radius:9px;font:inherit}input{margin-top:.3rem;background:#0d1117;color:inherit;border:1px solid #484f58}button{border:0;background:#238636;color:#fff;font-weight:700;cursor:pointer}.status{min-height:1.5em;margin-top:.8rem}.error{color:#ffa198}@media(prefers-color-scheme:light){body{background:#f6f8fa;color:#24292f}main,input{background:#fff}p{color:#57606a}}</style>
</head>
<body data-mode="{{.Mode}}" data-base-path="{{.BasePath}}">
<main>
  <h1>{{.Heading}}</h1>
  <p>{{.Description}}</p>
  <form id="authForm">
    {{if .NeedsCode}}<label>One-time setup code<input id="setupCode" type="password" autocomplete="one-time-code"></label>{{end}}
    {{if .NeedsName}}<label>Passkey name<input id="displayName" maxlength="80" value="{{.DefaultName}}" required></label>{{end}}
    <button id="authButton" type="submit">{{.Button}}</button>
  </form>
  <div id="authStatus" class="status" role="status" aria-live="polite"></div>
</main>
<script src="{{.ScriptURL}}" defer></script>
</body>
</html>
