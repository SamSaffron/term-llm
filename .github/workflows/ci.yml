name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          backend=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if changed_files=$(git diff --name-only --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA"); then
              backend=false
              if printf '%s\n' "$changed_files" | grep -Eq '\.go$|(^|/)go\.(mod|sum)$|^(cmd|internal)/|^Makefile$|^scripts/.*\.sh$|^\.github/workflows/(ci|scheduled-stress)\.yml$'; then
                backend=true
              fi
            else
              echo "Could not inspect the pull request diff; running race tests."
            fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true                   # caches module download + build cache keyed on module sums
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build, test, and vet nested modules
        run: scripts/verify_nested_modules.sh

      - name: Nested checkptr
        run: |
          for module in internal/reflow internal/terminal/renderer internal/terminal/runtime; do
            (cd "$module" && GODEBUG=checkptr=2 go test ./...)
          done

  race:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip race tests for non-backend changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend-relevant files changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true'

      - name: Set up Go
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Set up Node.js
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        if: needs.changes.outputs.backend == 'true'
        run: make frontend

      - name: Race-test Web UI lifecycle owners
        if: needs.changes.outputs.backend == 'true'
        run: go test -race ./internal/webrtc ./internal/session ./cmd

      - name: Race-test nested modules
        if: needs.changes.outputs.backend == 'true'
        run: |
          for module in internal/reflow internal/terminal/renderer internal/terminal/runtime; do
            (cd "$module" && go test -race ./...)
          done

  passkey-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: make frontend

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx --yes --package @playwright/test@1.62.1 playwright install --with-deps chromium

      - name: Hub passkey browser smoke
        timeout-minutes: 5
        run: scripts/hub_passkey_smoke.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-deps

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint

      - name: Typecheck and test frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Check frontend network policy
        run: scripts/check_frontend_network_policy.sh

      - name: Build frontend assets
        run: make frontend

      - name: Install Playwright Chromium
        timeout-minutes: 10
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser chat smoke
        timeout-minutes: 5
        run: scripts/browser_lifecycle_smoke.sh

      - name: Production-shaped Hub browser smoke
        timeout-minutes: 5
        run: scripts/hub_browser_lifecycle_smoke.sh

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: make frontend

      - name: Cross-build release and owned terminal targets
        run: scripts/cross_build_owned_terminal.sh
