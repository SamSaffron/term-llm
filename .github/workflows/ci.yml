name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true                   # caches module download + build cache keyed on module sums
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Test
        run: go test ./...

      - name: Race-test Web UI lifecycle owners
        run: go test -race ./internal/webrtc ./internal/session ./cmd

      - name: Vet
        run: go vet ./...

      - name: Build, test, vet, and race nested modules
        env:
          VERIFY_RACE: '1'
        run: scripts/verify_nested_modules.sh

      - name: Fuzz owned renderer differential, invariant, and parser paths
        timeout-minutes: 8
        run: scripts/fuzz_owned_renderer.sh

      - name: Upload fuzz failure corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owned-terminal-fuzz-corpus-${{ github.run_id }}
          path: internal/terminal/*/testdata/fuzz/
          if-no-files-found: ignore

      - name: Nested checkptr
        run: |
          for module in internal/reflow internal/terminal/renderer internal/terminal/runtime; do
            (cd "$module" && GODEBUG=checkptr=2 go test ./...)
          done

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx --yes --package @playwright/test@1.62.1 playwright install --with-deps chromium

      - name: Hub passkey browser smoke
        timeout-minutes: 5
        run: scripts/hub_passkey_smoke.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-deps

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint

      - name: Typecheck and test frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Check frontend network policy
        run: scripts/check_frontend_network_policy.sh

      - name: Build frontend assets
        run: make frontend

      - name: Install Playwright Chromium and WebKit
        timeout-minutes: 10
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Browser chat smoke
        timeout-minutes: 5
        run: scripts/browser_lifecycle_smoke.sh

      - name: Production-shaped Hub browser smoke
        timeout-minutes: 5
        run: scripts/hub_browser_lifecycle_smoke.sh

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: make frontend

      - name: Cross-build release and owned terminal targets
        run: scripts/cross_build_owned_terminal.sh
