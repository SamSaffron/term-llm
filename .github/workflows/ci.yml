name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true                   # caches module download + build cache keyed on module sums
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # no npm install in this repo — node binary caching is handled by the action itself

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Validate gateway Compose example
        run: go test ./ops -run '^TestGatewayComposeExampleParsesAndHasHealthGating$'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build, test, vet, and race nested modules
        env:
          VERIFY_RACE: '1'
        run: scripts/verify_nested_modules.sh

      - name: Fuzz owned renderer differential, invariant, and parser paths
        timeout-minutes: 8
        run: scripts/fuzz_owned_renderer.sh

      - name: Upload fuzz failure corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owned-terminal-fuzz-corpus-${{ github.run_id }}
          path: internal/terminal/*/testdata/fuzz/
          if-no-files-found: ignore

      - name: Nested checkptr
        run: |
          for module in internal/reflow internal/terminal/renderer internal/terminal/runtime; do
            (cd "$module" && GODEBUG=checkptr=2 go test ./...)
          done

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx --yes --package @playwright/test@1.54.1 playwright install --with-deps chromium

      - name: Browser lifecycle smoke
        timeout-minutes: 5
        run: scripts/browser_lifecycle_smoke.sh

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/reflow/go.sum
            internal/terminal/runtime/go.sum
            internal/terminal/renderer/go.sum

      - name: Cross-build release and owned terminal targets
        run: scripts/cross_build_owned_terminal.sh
