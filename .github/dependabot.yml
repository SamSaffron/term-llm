version: 2

# Minor and patch bumps arrive grouped; security updates stay as their own PRs.
# Go releases whose minimum toolchain is newer than the `go` directive in go.mod
# are skipped by Dependabot (0.x modules count as major bumps); raise the
# directive deliberately instead. The `toolchain` line in go.mod, not the `go`
# directive, is what selects the supported toolchain used by CI and releases.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Owned forks of the terminal runtime, renderer, and reflow; bumping these
  # copies is a deliberate upstream-sync decision (internal/terminal/README.md).
  - package-ecosystem: gomod
    directory: /internal/reflow
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /internal/terminal/runtime
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /internal/terminal/renderer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # These majors change the toolchain the frontend is validated against and
      # land together with a browser smoke run, so they stay manual.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
