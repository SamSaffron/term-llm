# Include inside the static demo server block (root must point at demo/dist).
# GET/HEAD only: browser-local chat never sends mutations to this server.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Exact JSON routes, including query strings, with no redirects or SPA fallback.
location = /healthz { default_type application/json; try_files /healthz.json =404; }
location = /api/nodes { default_type application/json; try_files /api/nodes.json =404; }
location = /api/attention { default_type application/json; try_files /api/attention.json =404; }
location = /api/delegations { default_type application/json; try_files /api/delegations.json =404; }
location = /api/registration-info { default_type application/json; try_files /api/registration-info.json =404; }
location /api/ { return 404; }
location ^~ /demo-api { return 404; }

# Only published demo chat routes get the stock shell, not arbitrary API paths.
location = /node/demo/ { try_files /index.html =404; }
location ~ ^/node/demo/chat/(1|2|demo-1|demo-2)$ { try_files /index.html =404; }
location /node/ { return 404; }
location ~ /\. { deny all; }
location ~ \.mjs$ {
    default_type application/javascript;
    expires -1;
    try_files $uri =404;
}
location /assets/ {
    expires 1h;
    try_files $uri =404;
}
location / {
    expires -1;
    try_files $uri $uri/ =404;
}
