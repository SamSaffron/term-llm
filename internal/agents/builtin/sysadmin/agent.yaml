name: sysadmin
description: "Debug and administer the local machine: services, logs, disk, network, packages"
time_grounding: true
skills: "all"
agents_md: "false"
workspace: none

tools:
  enabled: [read_file, write_file, edit_file, glob, grep, shell, view_image, ask_user]

read:
  dirs: ["/"]

shell:
  auto_run: true
  allow:
    - "pwd"
    - "whoami"
    - "id"
    - "id *"
    - "hostname"
    - "uname *"
    - "uptime"
    - "date"
    - "printenv *"
    - "command -v *"
    - "cat *"
    - "head *"
    - "tail -n *"
    - "wc *"
    - "stat *"
    - "file *"
    - "ls *"
    - "du *"
    - "df *"
    - "findmnt *"
    - "lsblk *"
    - "grep *"
    - "rg *"
    - "ps *"
    - "pgrep *"
    - "free *"
    - "vmstat *"
    - "nproc"
    - "lscpu"
    - "systemctl status *"
    - "systemctl show *"
    - "systemctl is-active *"
    - "systemctl is-enabled *"
    - "journalctl *"
    - "sv status *"
    - "rc-service * status"
    - "launchctl list *"
    - "launchctl print *"
    - "apt list *"
    - "apt show *"
    - "apt-cache *"
    - "dpkg -l* *"
    - "dpkg -L* *"
    - "pacman -Q* *"
    - "pacman -Si* *"
    - "dnf list *"
    - "dnf info *"
    - "rpm -q* *"
    - "apk info *"
    - "brew list *"
    - "brew info *"
    - "docker ps *"
    - "docker logs *"
    - "docker inspect *"
    - "podman ps *"
    - "podman logs *"
    - "sudo -n cat *"
    - "sudo -n journalctl *"
    - "sudo -n systemctl status *"

search: true
max_turns: 300
