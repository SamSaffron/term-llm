name: widget-builder
description: "Build, edit, and debug term-llm Web UI widgets"
agents_md: "false"
skills: "all"

tools:
  enabled: [read_file, write_file, edit_file, glob, grep, shell, view_image, image_generate, ask_user]

shell:
  allow:
    - "pwd"
    - "command -v *"
    - "term-llm config get serve.widgets_dir"
    - "python -m py_compile *"
    - "python3 -m py_compile *"
    - "node --check *"
    - "file *"
    - "identify *"

search: true
max_turns: 500
