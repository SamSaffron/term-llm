<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chat</title>
  <meta name="application-name" content="term-llm">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="term-llm">
  <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d1117'/%3E%3Cpath d='M17 14h30v6H24v26h16v-9H30v-6h17v21H17z' fill='%23ececec'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <style>
    :root{--startup-bg:#212121;--startup-bg-accent:rgba(255,255,255,.03);--startup-surface:#2f2f2f;--startup-surface-2:#373737;--startup-border:rgba(255,255,255,.08);--startup-text:#ececec;--startup-text-muted:#9a9a9a;--startup-accent:#fff;--startup-shadow:0 2px 8px rgba(0,0,0,.15);--startup-safe-top:env(safe-area-inset-top,0px);--startup-safe-right:env(safe-area-inset-right,0px);--startup-safe-bottom:env(safe-area-inset-bottom,0px);--startup-safe-left:env(safe-area-inset-left,0px)}
    @media(prefers-color-scheme:light){:root{--startup-bg:#fff;--startup-bg-accent:rgba(0,0,0,.02);--startup-surface:#fff;--startup-surface-2:#f7f7f8;--startup-border:rgba(0,0,0,.08);--startup-text:#0d0d0d;--startup-text-muted:#6e6e6e;--startup-accent:#0d0d0d;--startup-shadow:0 2px 8px rgba(0,0,0,.08)}}
    html,body,#root{margin:0;min-height:100%;background:var(--startup-bg);color:var(--startup-text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{overflow:hidden;-webkit-text-size-adjust:100%}
    .startup-splash{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:calc(1.5rem + var(--startup-safe-top)) calc(1.5rem + var(--startup-safe-right)) calc(1.5rem + var(--startup-safe-bottom)) calc(1.5rem + var(--startup-safe-left));background:radial-gradient(circle at top,var(--startup-bg-accent),transparent 55%),var(--startup-bg)}
    .startup-card{width:min(320px,100%);padding:1.5rem 1.35rem;border:1px solid var(--startup-border);border-radius:16px;background:var(--startup-surface);box-shadow:var(--startup-shadow);text-align:center}.startup-mark{width:52px;height:52px;margin:0 auto .9rem;border-radius:14px;display:grid;place-items:center;background:var(--startup-surface-2);border:1px solid var(--startup-border);font-size:1.45rem;font-weight:800}.startup-title{font-size:1.05rem;font-weight:800;letter-spacing:.01em}.startup-subtitle{margin-top:.4rem;color:var(--startup-text-muted);font-size:.92rem;line-height:1.45}.startup-spinner{width:22px;height:22px;margin:1rem auto 0;border-radius:50%;border:2px solid var(--startup-border);border-top-color:var(--startup-accent);animation:startup-spin .8s linear infinite}@keyframes startup-spin{to{transform:rotate(360deg)}}
  </style>
  <link rel="stylesheet" href="dist/app.css">
</head>
<body>
  <div id="root"><div class="startup-splash" role="status" aria-live="polite"><div class="startup-card"><div class="startup-mark" aria-hidden="true">⌘</div><div class="startup-title">term-llm</div><div class="startup-subtitle">Loading your chat shell…</div><div class="startup-spinner" aria-hidden="true"></div></div></div></div>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
